<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>IOL 核對小幫手</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="IOL 小幫手">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="top" id="top">
  <div class="top-row">
    <span class="brand">IOL 核對小幫手</span>
    <span id="eyeBadge" class="eye-badge none">尚未選擇手術眼</span>
    <span id="caseChip" class="chip" hidden></span>
    <span class="spacer"></span>
    <span id="progressChip" class="chip" hidden></span>
    <button class="btn sm" id="resetBtn" type="button"><span class="lg">開新個案</span><span class="sh">新個案</span></button>
  </div>
  <nav class="steps" id="steps" aria-label="步驟">
    <button type="button" data-step="eye">1 <span class="lg">選擇手術眼</span><span class="sh">選眼</span></button>
    <button type="button" data-step="upload">2 <span class="lg">上傳報告</span><span class="sh">上傳</span></button>
    <button type="button" data-step="verify">3 <span class="lg">核對量測資料</span><span class="sh">核對</span></button>
    <button type="button" data-step="calc">4 <span class="lg">計算與官網</span><span class="sh">計算</span></button>
  </nav>
</div>
<main id="main"></main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
</script>
<script src="../formulas/iol-constants.js"></script>
<script src="../formulas/iol-formulas.js"></script>
<script src="parse.js"></script>
<script src="ocr.js"></script>
<script src="official-fill.js"></script>
<script src="lens-presets.js"></script>
<script src="remote-calculations.js"></script>
<script src="app.js"></script>
</body>
</html>
